# Centralized configuration for the adoption/contact form.
# Referenced by layouts/partials/contact-form.html via site.Data.adoption_form.

transport_fee: "$180"

# {fee} is replaced with transport_fee at render time.
transport_note: "Ground transportation is arranged through a trusted pet transport service. The {fee} fee covers door-to-door delivery within the continental US. We will coordinate the details with you after your adoption is confirmed."

# Options for the "How would you like to receive your bunny?" dropdown.
# - show_fee: appends " (<transport_fee>)" to both the submitted value and the label
# - show_note: reveals the transport note when this option is selected
delivery_options:
  - value: "Pickup"
    label: "Pickup — I will pick up in person (Seattle, WA)"
  - value: "Transportation - Rabbitry Arranged"
    label: "Transportation(US Only) — Arrange shared ground transport for me"
    show_fee: true
    show_note: true
  - value: "Transportation - Self Arranged"
    label: "Transportation — I will arrange my own transport"
